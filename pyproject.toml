[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dictate-workbench"
version = "0.1.0"
description = "Turn long spoken app-testing notes into clear, actionable prompts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "sounddevice>=0.5,<1", "numpy>=1.26,<3", "httpx>=0.27,<1", "keyring>=25,<26"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "pyinstaller>=6,<7"]

[project.gui-scripts]
dictate = "dictate.app:main"

[tool.setuptools.packages.find]
include = ["dictate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
